<body>

    <header class="app-header">
        <span class="title"><span class="rune">ᚢ</span> Ulfadr</span>

    <div class="info-bar" id="infoBar">
        <span><span class="rune">ᚲ</span> <span id="totalDaysDisplay">354</span> дня</span>
        <span><span class="rune">ᛗ</span> <span id="monthsCountDisplay">12</span> месяцев</span>
        <span><span class="rune">ᚦ</span> <span id="yearTypeDisplay">обычный</span></span>
    </div>

    <div id="pagesContainer"></div>

    <div class="cycle-table hidden" id="cycleTable">
        <h3><span class="rune">ᚲ</span> Циклы Аукумануда · 2026–2125</h3>
        <table>
            <thead>
                <tr>
                    <th>Год</th>
                    <th>Начало (день недели)</th>
                    <th>Дней</th>
                    <th>Аукумануд</th>
                </tr>
            </thead>
            <tbody id="cycleTableBody"></tbody>
        </table>
    </div>

    <nav class="bottom-nav">
        <button id="goToday" class="active">
            <span class="rune">ᚲ</span>
            <span>Сегодня</span>
        </button>
        <button id="goHolidays">
            <span class="rune">ᚠ</span>
            <span>Праздники</span>
        </button>
        <button id="goCycle">
            <span class="rune">ᛉ</span>
            <span>Циклы</span>
        </button>

    <script>
        (function() {
            'use strict';

            const AUKUMANUDUR_DAYS = 30;
            const AUKU_START_YEAR = 2029;
            const AUKU_INTERVAL = 3;
            let currentYear = 2026;

            function hasAukumanudur(year) {
                return year >= AUKU_START_YEAR && (year - AUKU_START_YEAR) % AUKU_INTERVAL === 0;
            }

            function getFirstFridayAfter(monthDays, startDay, monthIndex, dayOffset) {
                let daysBefore = 0;
                for (let i = 0; i < monthIndex; i++) {
                    daysBefore += monthDays[i];
                }
                const startOffset = (startDay + daysBefore) % 7;
                let candidate = dayOffset + 1;
                while (true) {
                    const dayOffsetFromStart = candidate - 1;
                    const dow = (startOffset + dayOffsetFromStart) % 7;
                    if (dow === 5) return candidate;
                    candidate++;
                }
            }

            function getThursdayAfter(monthDays, startDay, monthIndex, dayOffset) {
                let daysBefore = 0;
                for (let i = 0; i < monthIndex; i++) {
                    daysBefore += monthDays[i];
                }
                const startOffset = (startDay + daysBefore) % 7;
                let candidate = dayOffset + 1;
                while (true) {
                    const dayOffsetFromStart = candidate - 1;
                    const dow = (startOffset + dayOffsetFromStart) % 7;
                    if (dow === 4) return candidate;
                    candidate++;
                }
            }

            function buildMonths(targetYear) {
                const hasAuku = hasAukumanudur(targetYear);

                const baseMonths = [
                    { name: 'Гормануд', days: 29, holidays: [1, 2, 3, 4, 5, 6, 7, 8, 9], season: 'Зима', rune: 'ᚷ' },
                    { name: 'Фрёр', days: 30, holidays: [], season: 'Зима', rune: 'ᚠ' },
                    { name: 'Йольмануд', days: 29, holidays: [21, 22, 23, 24, 25, 26, 27, 28, 29], season: 'Зима', rune: 'ᛃ' },
                    { name: 'Торри', days: 30, holidays: [], season: 'Зима', rune: 'ᛏ' },
                    { name: 'Гои', days: 29, holidays: [], season: 'Зима', rune: 'ᚷ' },
                    { name: 'Эйнмануд', days: 30, holidays: [], season: 'Зима', rune: 'ᛇ' },
                    { name: 'Харпа', days: 29, holidays: [20], season: 'Лето', rune: 'ᚺ' },
                    { name: 'Скерпла', days: 30, holidays: [], season: 'Лето', rune: 'ᛊ' }
                ];

                const aukuMonth = {
                    name: 'Аукумануд',
                    days: AUKUMANUDUR_DAYS,
                    holidays: [],
                    season: 'Лето',
                    rune: 'ᛉ',
                    isAuku: true
                };

                const afterAuku = [
                    { name: 'Сольмануд', days: 29, holidays: [24], season: 'Лето', rune: 'ᛋ' },
                    { name: 'Эйирид', days: 30, holidays: [], season: 'Лето', rune: 'ᛇ' },
                    { name: 'Твимануд', days: 29, holidays: [], season: 'Лето', rune: 'ᛏ' },
                    { name: 'Хаустмануд', days: 30, holidays: [], season: 'Лето', rune: 'ᚺ' }
                ];

                const months = [];
                months.push(...baseMonths);
                if (hasAuku) {
                    months.push(aukuMonth);
                }
                months.push(...afterAuku);

                return months;
            }

            function getYearStartDay(year) {
                let startDay = 1; // Вторник 14 октября 2025

                for (let y = 2026; y <= year; y++) {
                    const prevMonths = buildMonths(y - 1);
                    const totalDays = prevMonths.reduce((sum, m) => sum + m.days, 0);
                    startDay = (startDay + totalDays) % 7;
                }

                for (let y = 2024; y >= year; y--) {
                    const currMonths = buildMonths(y);
                    const totalDays = currMonths.reduce((sum, m) => sum + m.days, 0);
                    startDay = (startDay - totalDays % 7 + 7) % 7;
                }

                return startDay;
            }

            function buildCalendar(year) {
                const months = buildMonths(year);
                const monthDays = months.map(m => m.days);
                const yearStartDay = getYearStartDay(year);
                const hasAuku = hasAukumanudur(year);

                const torriIndex = months.findIndex(m => m.name === 'Торри');
                const goiIndex = months.findIndex(m => m.name === 'Гои');
                const harpaIndex = months.findIndex(m => m.name === 'Харпа');

                const thorrablot = getFirstFridayAfter(monthDays, yearStartDay, torriIndex, 19);
                const goi = getFirstFridayAfter(monthDays, yearStartDay, goiIndex, 18);
                const sigrblot = getThursdayAfter(monthDays, yearStartDay, harpaIndex, 18);

                months[torriIndex].holidays = [1, 2, 3, thorrablot];
                months[goiIndex].holidays = [goi];
                months[harpaIndex].holidays = [20, sigrblot];

                const totalDays = months.reduce((sum, m) => sum + m.days, 0);

                const HOLIDAYS = [
                    { name: 'Зимние Ночи', date: '1–9 Гормануд', desc: 'Начало года, 9 дней (14–22 октября)' },
                    { name: 'Йоль', date: '21–29 Йольмануд', desc: 'Зимнее солнцестояние, 12 дней' },
                    { name: 'Торраблот', date: `${thorrablot} Торри`, desc: 'Первая пятница после 19 Торри' },
                    { name: 'Сигрблот', date: `${sigrblot} Харпа`, desc: 'Четверг после 18 Харпа' },
                    { name: 'Мидисоммер', date: '24 Сольмануд', desc: 'Летнее солнцестояние' },
                    { name: 'Варблот', date: '20 Харпа', desc: 'Весеннее жертвоприношение' },
                    { name: 'Гои', date: `${goi} Гои`, desc: 'Первая пятница после 18 Гои' },
                    { name: 'Эйирид', date: 'Середина Эйирид', desc: 'Время тингов и клятв' },
                    { name: 'Твимануд', date: 'Середина Твимануд', desc: 'Двойное полнолуние' }
                ];

                return {
                    year,
                    months,
                    totalDays,
                    yearStartDay,
                    hasAuku,
                    holidays: HOLIDAYS
                };
            }

            function generateCycleTable() {
                const tbody = document.getElementById('cycleTableBody');
                tbody.innerHTML = '';

                for (let y = 2026; y <= 2125; y++) {
                    const startDay = getYearStartDay(y);
                    const months = buildMonths(y);
                    const totalDays = months.reduce((sum, m) => sum + m.days, 0);
                    const hasAuku = hasAukumanudur(y);

                    const tr = document.createElement('tr');

                    const yearCell = document.createElement('td');
                    yearCell.className = 'year-col';
                    yearCell.textContent = y;
                    tr.appendChild(yearCell);

                    const startCell = document.createElement('td');
                    startCell.textContent = WEEKDAY_NAMES_SHORT[startDay];
                    tr.appendChild(startCell);

                    const daysCell = document.createElement('td');
                    daysCell.textContent = totalDays;
                    tr.appendChild(daysCell);

                    const aukuCell = document.createElement('td');
                    if (hasAuku) {
                        aukuCell.className = 'has-auku';
                        aukuCell.innerHTML = '✅ <span class="rune">ᛉ</span>';
                    } else {
                        aukuCell.textContent = '--';
                    }
                    tr.appendChild(aukuCell);

                    tbody.appendChild(tr);
                }
            }

            const WEEKDAY_NAMES_SHORT = ['Сун', 'Мо', 'Тю', 'Од', 'То', 'Фр', 'Ла'];

            const container = document.getElementById('pagesContainer');
            const yearDisplay = document.getElementById('yearDisplay');
            const totalDaysDisplay = document.getElementById('totalDaysDisplay');
            const monthsCountDisplay = document.getElementById('monthsCountDisplay');
            const yearTypeDisplay = document.getElementById('yearTypeDisplay');

            function renderYear(year) {
                const data = buildCalendar(year);
                const { months, totalDays, yearStartDay, hasAuku, holidays } = data;

                yearDisplay.textContent = year;
                totalDaysDisplay.textContent = totalDays;
                monthsCountDisplay.textContent = months.length;
                yearTypeDisplay.textContent = hasAuku ? 'с Аукуманудом' : 'обычный';

                container.innerHTML = '';

                const todayScandYear = 2026;
                const todayDayOfYear = 307; // 12 день Твимануда

                months.forEach((monthObj, index) => {
                    const page = document.createElement('div');
                    page.className = 'page';

                    const header = document.createElement('div');
                    header.className = 'page-header';

                    const title = document.createElement('span');
                    title.className = 'month-title';
                    const daysCount = monthObj.days;
                    const rune = monthObj.rune || 'ᚠ';
                    const name = monthObj.isAuku ? 'Аукумануд' : monthObj.name;
                    const daysLabel = daysCount === 1 ? 'день' :
                                      (daysCount >= 2 && daysCount <= 4) ? 'дня' : 'дней';
                    title.innerHTML = `<span class="rune">${rune}</span> ${name} <small>${daysCount} ${daysLabel}</small>`;
                    header.appendChild(title);

                    const seasonLabel = document.createElement('span');
                    seasonLabel.className = 'season-label';
                    const sRune = monthObj.season === 'Зима' ? 'ᛇ' : 'ᛉ';
                    seasonLabel.innerHTML = `${sRune} ${monthObj.season}`;
                    header.appendChild(seasonLabel);

                    page.appendChild(header);

                    const grid = document.createElement('div');
                    grid.className = 'month-grid';

                    const wd = document.createElement('div');
                    wd.className = 'weekdays';
                    WEEKDAY_NAMES_SHORT.forEach(d => {
                        const span = document.createElement('span');
                        span.textContent = d;
                        wd.appendChild(span);
                    });
                    grid.appendChild(wd);

                    const daysGrid = document.createElement('div');
                    daysGrid.className = 'days';

                    let daysBefore = 0;
                    for (let i = 0; i < index; i++) {
                        daysBefore += months[i].days;
                    }
                    const startDay = (yearStartDay + daysBefore) % 7;

                    for (let i = 0; i < startDay; i++) {
                        const empty = document.createElement('span');
                        empty.className = 'day empty';
                        empty.textContent = '';
                        daysGrid.appendChild(empty);
                    }

                    for (let d = 1; d <= daysCount; d++) {
                        const cell = document.createElement('span');
                        cell.className = 'day';
                        cell.textContent = d;

                        const dow = (startDay + d - 1) % 7;
                        if (dow === 6) cell.classList.add('saturday');

                        if (todayScandYear === year) {
                            const dayOffset = daysBefore + d;
                            if (dayOffset === todayDayOfYear) {
                                cell.classList.add('today');
                                cell.id = 'todayCell'; // Добавляем id для прокрутки
                            }
                        }

                        if (monthObj.holidays && monthObj.holidays.includes(d)) {
                            cell.classList.add('holiday');
                        }

                        daysGrid.appendChild(cell);
                    }

                    grid.appendChild(daysGrid);
                    page.appendChild(grid);

                    if (index === months.length - 1) {
                        const listBlock = document.createElement('div');
                        listBlock.className = 'holiday-list-inline';

                        const titleBlock = document.createElement('h3');
                        titleBlock.innerHTML = `<span class="rune">ᚲ</span> Праздники / Hátíðir`;
                        listBlock.appendChild(titleBlock);

                        holidays.forEach(item => {
                            const div = document.createElement('div');
                            div.className = 'holiday-item-inline';
                            div.innerHTML = `
                                        <span class="name">${item.name}</span>
                                        <span class="date">${item.date}</span>
                                        <span class="desc">${item.desc}</span>
                                    `;
                            listBlock.appendChild(div);
                        });

                        page.appendChild(listBlock);
                    }

                    const footer = document.createElement('div');
                    footer.className = 'page-footer';
                    footer.innerHTML = `
                                <span><span class="rune">ᚲ</span> ${daysCount} ${daysLabel}</span>
                                <span><span class="rune">ᚠ</span> ᚢᛚᚠᚨᚦᚱ · ${totalDays} дней</span>
                            `;
                    page.appendChild(footer);

                    container.appendChild(page);
                });
            }

            function scrollToToday() {
                const todayCell = document.getElementById('todayCell');
                if (todayCell) {
                    todayCell.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            }

            document.getElementById('prevYear').addEventListener('click', function() {
                currentYear--;
                renderYear(currentYear);
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });

            document.getElementById('nextYear').addEventListener('click', function() {
                currentYear++;
                renderYear(currentYear);
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });

            document.getElementById('goToday').addEventListener('click', function() {
                currentYear = 2026;
                renderYear(currentYear);
                document.getElementById('cycleTable').classList.add('hidden');
                setActiveNav('goToday');
                // Прокручиваем к белому квадрату
                setTimeout(scrollToToday, 100);
            });

            document.getElementById('goHolidays').addEventListener('click', function() {
                document.getElementById('cycleTable').classList.add('hidden');
                const holidayBlocks = document.querySelectorAll('.holiday-list-inline');
                if (holidayBlocks.length > 0) {
                    const lastBlock = holidayBlocks[holidayBlocks.length - 1];
                    lastBlock.scrollIntoView({ behavior: 'smooth', block: 'start' });
                } else {
                    window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
                }
                setActiveNav('goHolidays');
            });

            document.getElementById('goCycle').addEventListener('click', function() {
                const table = document.getElementById('cycleTable');
                table.classList.toggle('hidden');
                if (!table.classList.contains('hidden')) {
                    table.scrollIntoView({ behavior: 'smooth', block: 'start' });
                    setActiveNav('goCycle');
                } else {
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                    setActiveNav('goToday');
                }
            });

            function setActiveNav(activeId) {
                const buttons = ['goToday', 'goHolidays', 'goCycle'];
                buttons.forEach(id => {
                    const btn = document.getElementById(id);
                    if (id === activeId) {
                        btn.classList.add('active');
                    } else {
                        btn.classList.remove('active');
                    }
                });
            }

            generateCycleTable();
            renderYear(2026);

            const aukuYears = [];
            for (let y = 2026; y <= 2125; y++) {
                if (hasAukumanudur(y)) {
                    aukuYears.push(y);
                }
            }
            console.log('📆 Годы с Аукуманудом (2026–2125):');
            console.log(aukuYears.join(', '));
            console.log(`Всего: ${aukuYears.length} лет из 100`);
            console.log('Сегодня: 12 день Твимануда, 2026 год');

        })();
    </script>

</body>
</html>
